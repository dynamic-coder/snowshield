<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Shield</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">

  <style>

    body {
      font-family: 'Syne', sans-serif;

      background:
        radial-gradient(circle at 20% 20%, #0ea5e9 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, #22d3ee 0%, transparent 40%),
        #020617;

      overflow-x: hidden;
    }

    .glass {
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .glow {
      box-shadow: 0 0 40px rgba(34,211,238,0.4);
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.6;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .snow::before {

      content: "";

      position: absolute;

      width: 100%;
      height: 100%;

      background:
        url('https://www.transparenttextures.com/patterns/snow.png');

      opacity: 0.05;

      pointer-events: none;
    }

  </style>
</head>

<body class="snow text-white">

  <div class="min-h-screen flex flex-col items-center justify-center px-4">

    <h1 class="text-4xl font-bold mb-2 tracking-wide">
      ❄️ Snow Shield
    </h1>

    <p class="text-cyan-300 mb-10">
      AI Powered Protection System
    </p>

    <div class="relative mb-12">

      <div class="absolute inset-0 rounded-full glow pulse"></div>

      <div class="w-40 h-40 rounded-full glass flex items-center justify-center text-5xl">

        🛡️

      </div>

    </div>

    <div class="glass rounded-2xl p-6 w-full max-w-md mb-6">

      <h2 class="text-xl mb-2">
        System Status
      </h2>

      <p class="text-green-400">
        ✔ All systems secure
      </p>

    </div>

    <!-- Navigation Buttons -->

    <div class="grid grid-cols-2 gap-4 w-full max-w-md">

      <!-- Scan -->

      <button
        onclick="goToScan()"
        class="glass p-4 rounded-xl hover:scale-105 transition glow">

        🔍 Scan

      </button>

      <!-- Settings -->

      <button
        class="glass p-4 rounded-xl hover:scale-105 transition glow">

        ⚙️ Settings

      </button>

      <!-- Reports -->

      <button
        onclick="window.location.href='reports.html'"
        class="glass p-4 rounded-xl hover:scale-105 transition glow">

        📊 Reports

      </button>

      <!-- Alerts -->

      <button
        onclick="window.location.href='alerts.html'"
        class="glass p-4 rounded-xl hover:scale-105 transition glow">

        🚨 Alerts

      </button>

    </div>

  </div>

  <script>

    function goToScan() {

      window.location.href = "scan.html";

    }

  </script>

</body>
</html>
