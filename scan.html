<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Snow Shield</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050d1a;
      --surface: #0b1829;
      --surface2: #0f2035;
      --border: rgba(100, 200, 255, 0.12);
      --cyan: #4fc8f0;
      --cyan-dim: rgba(79, 200, 240, 0.15);
      --cyan-glow: rgba(79, 200, 240, 0.35);
      --white: #e8f4ff;
      --muted: #5a7a99;
      --safe: #3dd68c;
      --safe-bg: rgba(61, 214, 140, 0.1);
      --warn: #f5a623;
      --warn-bg: rgba(245, 166, 35, 0.1);
      --danger: #f0506e;
      --danger-bg: rgba(240, 80, 110, 0.1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .phone-wrap {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Atmospheric background */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(30, 90, 160, 0.5) 0%, transparent 70%);
      top: -80px; left: -60px;
    }
    .bg-orb-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(79, 200, 240, 0.12) 0%, transparent 70%);
      top: 80px; right: -40px;
    }
    .bg-orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(20, 60, 120, 0.4) 0%, transparent 70%);
      bottom: 200px; left: 50%; transform: translateX(-50%);
    }

    /* Snowflake particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .flake {
      position: absolute;
      color: rgba(79, 200, 240, 0.4);
      font-size: 10px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 0 20px 40px;
    }

    /* Header */
    .header {
      padding: 54px 0 28px;
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .shield-icon {
      width: 44px;
      height: 44px;
      position: relative;
    }
    .shield-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px var(--cyan-glow));
      animation: shieldPulse 3s ease-in-out infinite;
    }
    @keyframes shieldPulse {
      0%, 100% { filter: drop-shadow(0 0 10px var(--cyan-glow)); }
      50% { filter: drop-shadow(0 0 22px rgba(79, 200, 240, 0.7)); }
    }

    .app-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat-pill {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
      display: block;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Input section */
    .input-section {
      margin-bottom: 16px;
    }

    .input-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    .input-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .input-box:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px var(--cyan-dim);
    }
    .input-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--white);
      placeholder-color: var(--muted);
    }
    .input-box input::placeholder {
      color: var(--muted);
    }
    .link-icon {
      color: var(--muted);
      flex-shrink: 0;
    }
    .paste-btn {
      background: var(--cyan-dim);
      border: 1px solid rgba(79, 200, 240, 0.25);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .paste-btn:hover { background: rgba(79, 200, 240, 0.25); }

    /* Scan button */
    .scan-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #1a6fa0 0%, #0d4a70 100%);
      border: 1.5px solid rgba(79, 200, 240, 0.4);
      border-radius: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      cursor: pointer;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.3s;
      box-shadow: 0 4px 24px rgba(13, 74, 112, 0.5);
    }
    .scan-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(79, 200, 240, 0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scan-btn:hover::before { opacity: 1; }
    .scan-btn:active { transform: scale(0.98); }
    .scan-btn .btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Scanning animation */
    .scanning .scan-btn { pointer-events: none; }
    .scan-loader {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .scanning .scan-loader { display: block; }
    .scanning .scan-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Result card */
    .result-card {
      border-radius: 20px;
      padding: 22px;
      border: 1.5px solid;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: none;
      margin-bottom: 16px;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.safe {
      background: var(--safe-bg);
      border-color: rgba(61, 214, 140, 0.3);
    }
    .result-card.suspicious {
      background: var(--warn-bg);
      border-color: rgba(245, 166, 35, 0.3);
    }
    .result-card.dangerous {
      background: var(--danger-bg);
      border-color: rgba(240, 80, 110, 0.3);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .result-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .safe .result-icon { background: rgba(61, 214, 140, 0.15); }
    .suspicious .result-icon { background: rgba(245, 166, 35, 0.15); }
    .dangerous .result-icon { background: rgba(240, 80, 110, 0.15); }

    .result-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .safe .result-title { color: var(--safe); }
    .suspicious .result-title { color: var(--warn); }
    .dangerous .result-title { color: var(--danger); }

    .result-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Risk meter */
    .risk-meter {
      margin-bottom: 16px;
    }
    .risk-meter-label {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .risk-score-val {
      font-weight: 500;
    }
    .safe .risk-score-val { color: var(--safe); }
    .suspicious .risk-score-val { color: var(--warn); }
    .dangerous .risk-score-val { color: var(--danger); }
    .meter-track {
      height: 6px;
      background: rgba(255,255,255,0.07);
      border-radius: 100px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .safe .meter-fill { background: linear-gradient(90deg, #3dd68c, #2ab574); }
    .suspicious .meter-fill { background: linear-gradient(90deg, #f5a623, #d4861a); }
    .dangerous .meter-fill { background: linear-gradient(90deg, #f0506e, #c73050); }

    /* Signal tags */
    .signals {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .signal-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      color: rgba(232, 244, 255, 0.8);
    }
    .signal-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .safe .signal-dot { background: var(--safe); }
    .suspicious .signal-dot { background: var(--warn); }
    .dangerous .signal-dot { background: var(--danger); }

    /* Recent scans */
    .section-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .scan-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scan-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .scan-badge {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .scan-badge.safe { background: var(--safe); box-shadow: 0 0 8px var(--safe); }
    .scan-badge.suspicious { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .scan-badge.dangerous { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    .scan-url {
      flex: 1;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .scan-time {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(5, 13, 26, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 12px 0 24px;
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 4px 20px;
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    .nav-item.active { opacity: 1; }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.active svg { color: var(--cyan); }
    .nav-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .nav-item.active .nav-label { color: var(--cyan); }

    .pb-nav { padding-bottom: 90px; }
  </style>
</head>
<body>

<div class="phone-wrap">
  <!-- Background effects -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="particles" id="particles"></div>

  <div class="content pb-nav">
    <!-- Header -->
    <div class="header">
      <div class="logo-wrap">
        <div class="shield-icon">
          <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 4L6 10V22C6 31.4 13.1 40.1 22 42C30.9 40.1 38 31.4 38 22V10L22 4Z" fill="rgba(79,200,240,0.12)" stroke="#4fc8f0" stroke-width="1.5"/>
            <path d="M22 10L11 14.5V22C11 28.1 15.9 33.9 22 35.5C28.1 33.9 33 28.1 33 22V14.5L22 10Z" fill="rgba(79,200,240,0.08)" stroke="rgba(79,200,240,0.5)" stroke-width="1"/>
            <!-- Snowflake inside shield -->
            <line x1="22" y1="16" x2="22" y2="30" stroke="#4fc8f0" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="20" x2="29" y2="26" stroke="#4fc8f0" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15" y1="26" x2="29" y2="20" stroke="#4fc8f0" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="22" cy="23" r="2" fill="#4fc8f0"/>
          </svg>
        </div>
        <span class="app-name">Snow Shield</span>
      </div>
      <p class="tagline">Arctic Labs · Link Scanner</p>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-pill">
        <span class="stat-num">2.4M</span>
        <span class="stat-label">Links Scanned</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num">98.7%</span>
        <span class="stat-label">Accuracy</span>
      </div>
      <div class="stat-pill">
        <span class="stat-num">412K</span>
        <span class="stat-label">Threats Blocked</span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-section">
      <span class="input-label">Scan a link</span>
      <div class="input-box">
        <svg class="link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input type="url" id="urlInput" placeholder="https://example.com/..." autocomplete="off" />
        <button class="paste-btn" onclick="pasteURL()">Paste</button>
      </div>
    </div>

    <!-- Scan button -->
    <button class="scan-btn" id="scanBtn" onclick="runScan()">
      <div class="btn-inner">
        <div class="scan-loader"></div>
        <span class="scan-text">⬡ &nbsp;SCAN LINK</span>
      </div>
    </button>

    <!-- Result card -->
    <div id="resultCard" class="result-card">
      <div class="result-header">
        <div class="result-icon" id="resultIcon"></div>
        <div>
          <div class="result-title" id="resultTitle"></div>
          <div class="result-subtitle" id="resultSubtitle"></div>
        </div>
      </div>
      <div class="risk-meter">
        <div class="risk-meter-label">
          <span>Risk Score</span>
          <span class="risk-score-val" id="riskScoreVal">0/100</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="meterFill" style="width:0%"></div>
        </div>
      </div>
      <div class="signals" id="signalsList"></div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">Recent Scans</span>
      <div class="divider-line"></div>
    </div>

    <!-- Recent scans list -->
    <div class="scan-list" id="scanHistory">
      <div class="scan-item">
        <div class="scan-badge safe"></div>
        <span class="scan-url">github.com/torvalds/linux</span>
        <span class="scan-time">2m ago</span>
      </div>
      <div class="scan-item">
        <div class="scan-badge dangerous"></div>
        <span class="scan-url">paypa1-secure-verify.xyz</span>
        <span class="scan-time">14m ago</span>
      </div>
      <div class="scan-item">
        <div class="scan-badge suspicious"></div>
        <span class="scan-url">free-gift-claim-now.net</span>
        <span class="scan-time">1h ago</span>
      </div>
      <div class="scan-item">
        <div class="scan-badge safe"></div>
        <span class="scan-url">docs.anthropic.com</span>
        <span class="scan-time">3h ago</span>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="nav-label">Scan</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="nav-label">History</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10M12 20V4M6 20v-6"/>
      </svg>
      <span class="nav-label">Stats</span>
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a6 6 0 0 1 12 0v2"/>
      </svg>
      <span class="nav-label">Profile</span>
    </div>
  </nav>
</div>
<script>
async function pasteURL() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('urlInput').value = text;
  } catch {
    document.getElementById('urlInput').focus();
  }
}

const results = {
  safe: {
    title: 'Link is Safe',
    subtitle: 'No threats detected',
    icon: '✦',
    score: 10,
    signals: []
  },

  suspicious: {
    title: 'Suspicious Link',
    subtitle: 'Proceed with caution',
    icon: '⚠',
    score: 50,
    signals: []
  },

  dangerous: {
    title: 'Dangerous!',
    subtitle: 'Do NOT visit this link',
    icon: '✕',
    score: 95,
    signals: []
  }
};

async function runScan() {

  const url =
    document.getElementById('urlInput').value.trim();

  if (!url) {
    alert('Please enter a URL');
    return;
  }

  const btn =
    document.getElementById('scanBtn');

  const card =
    document.getElementById('resultCard');

  btn.parentElement.classList.add('scanning');

  btn.disabled = true;

  card.style.display = 'none';

  try {

    const response = await fetch(
      'https://snowshield.onrender.com/scan',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          url: url
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        'Server returned ' + response.status
      );
    }

    const data = await response.json();

    results[data.status].score =
      data.risk_score;

    results[data.status].signals =
      data.signals;

    showResult(data.status, url);

  } catch (error) {

    console.error(error);

    alert(
      'Could not connect to SnowShield backend.'
    );

  } finally {

    btn.parentElement.classList.remove(
      'scanning'
    );

    btn.disabled = false;
  }
}

function showResult(type, url) {

  const data = results[type];

  const card =
    document.getElementById('resultCard');

  card.className =
    'result-card ' + type;

  document.getElementById(
    'resultIcon'
  ).textContent = data.icon;

  document.getElementById(
    'resultTitle'
  ).textContent = data.title;

  document.getElementById(
    'resultSubtitle'
  ).textContent = data.subtitle;

  document.getElementById(
    'riskScoreVal'
  ).textContent = data.score + '/100';

  document.getElementById(
    'meterFill'
  ).style.width = data.score + '%';

  document.getElementById(
    'signalsList'
  ).innerHTML =
    data.signals.map(signal => `
      <div class="signal-item">
        <div class="signal-dot"></div>
        <span>${signal}</span>
      </div>
    `).join('');

  // =========================
  // SAVE SCAN HISTORY
  // =========================

  const historyItem = {
    url: url,
    status: type,
    score: data.score,
    time: new Date().toLocaleTimeString()
  };

  let history =
    JSON.parse(
      localStorage.getItem(
        'snowshield_history'
      )
    ) || [];

  history.unshift(historyItem);

  // Keep latest 10 scans
  history = history.slice(0, 10);

  localStorage.setItem(
    'snowshield_history',
    JSON.stringify(history)
  );

  // Reload history UI
  loadHistory();

  // Show result card
  card.style.display = 'block';
}

function loadHistory() {

  const historyContainer =
    document.getElementById(
      'scanHistory'
    );

  const history =
    JSON.parse(
      localStorage.getItem(
        'snowshield_history'
      )
    ) || [];

  if (history.length === 0) {

    historyContainer.innerHTML = `
      <div class="scan-item">
        <span class="scan-url">
          No scans yet
        </span>
      </div>
    `;

    return;
  }

  historyContainer.innerHTML =
    history.map(item => `

      <div class="scan-item">

        <div class="
          scan-badge ${item.status}
        "></div>

        <span class="scan-url">
          ${item.url}
        </span>

        <span class="scan-time">
          ${item.score}/100
        </span>

      </div>

    `).join('');
}

// ENTER key support
document.getElementById(
  'urlInput'
).addEventListener(
  'keydown',
  function(e) {

    if (e.key === 'Enter') {
      runScan();
    }
  }
);

// Load history on startup
loadHistory();
</script>
